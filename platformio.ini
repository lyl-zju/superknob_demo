[env:lolin32_lite]
platform = espressif32
board = lolin32_lite
framework = arduino
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/set_project_temp.py
lib_deps = 
	askuric/Simple FOC@2.2.1
	lvgl/lvgl@8.4.0
	bodmer/TFT_eSPI@2.5.0
	t-vk/ESP32 BLE Keyboard@^0.3.2
