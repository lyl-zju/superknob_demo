; PlatformIO Project Configuration File

[env:lolin32_lite]
platform = espressif32@7.1.1
board = lolin32_lite
framework = arduino
monitor_speed = 115200

board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/set_project_temp.py
build_flags =
	; Keep display configuration in the project. Do not edit .pio/libdeps files.
	-D LV_CONF_SKIP=1
	-D LV_COLOR_DEPTH=16
	-D LV_COLOR_16_SWAP=0
	-D LV_TICK_CUSTOM=1
	-D LV_FONT_SIMSUN_16_CJK=1
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_RGB_ORDER=TFT_RGB
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=16
	-D TFT_DC=15
	-D TFT_RST=13
	-D TFT_BL=17
	-D TFT_BACKLIGHT_ON=1
	-D SPI_FREQUENCY=27000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
lib_deps =
	askuric/Simple FOC@2.2.1
	lvgl/lvgl@8.4.0
	bodmer/TFT_eSPI@2.5.0
	t-vk/ESP32 BLE Keyboard@^0.3.2
